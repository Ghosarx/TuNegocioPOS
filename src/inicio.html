<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Primer arranque</title>
<link rel="stylesheet" href="style.css">
<script src="boleta.js"></script>
</head>
<body>

<div class="container" id="pasoAdmin">
  <p class="paso">Paso 3 de 4</p>
  <h2>Crea tu cuenta de administrador</h2>
  <p>Con esta cuenta gestionas productos, empleados, ventas y la configuración.</p>
  <label>Tu nombre</label>
  <input type="text" id="adminNombre" placeholder="Ej.: María Pérez">
  <label>Usuario</label>
  <input type="text" id="adminUsuario" value="admin">
  <div class="grid-2">
    <div><label>Contraseña</label><input type="password" id="adminPassword" placeholder="Mínimo 6 caracteres"></div>
    <div><label>Repite la contraseña</label><input type="password" id="adminPassword2"></div>
  </div>
  <label>Pregunta de seguridad (para recuperar la contraseña)</label>
  <input type="text" id="adminPregunta" placeholder="Ej.: ¿Cómo se llamaba mi primera mascota?">
  <label>Respuesta</label>
  <input type="password" id="adminRespuesta">
  <div class="error oculto" id="adminError"></div>
  <button id="btnCrearAdmin">Crear cuenta y continuar</button>
</div>

<div class="container oculto" id="pasoImpresora">
  <p class="paso">Paso 4 de 4</p>
  <h2>Impresora de boletas</h2>
  <p>Elige tu impresora térmica. Evita las impresoras virtuales (PDF, OneNote, Fax).</p>
  <label>Impresora</label>
  <select id="impresoraSelect"></select>
  <label>Ancho del papel</label>
  <select id="papelSelect">
    <option value="72.1">80 mm (el más común)</option>
    <option value="48">58 mm</option>
  </select>
  <div class="error oculto" id="impresoraError"></div>
  <div class="exito oculto" id="impresoraExito"></div>
  <button id="btnPrueba" class="secundario">Imprimir prueba</button>
  <button id="btnFinalizar">Guardar y terminar</button>
  <p class="enlace" id="btnOmitir">Configurar después</p>
</div>

<script src="inicio.js"></script>
</body>
</html>
